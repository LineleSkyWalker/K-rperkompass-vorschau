<title>KØRPERKOMPASS Rezepte</title>
{{FONTS}}
<style>
/* Layout: Workbook-Seiten als App. Türkiser Auftakt mit Logo, Schreibschrift und Bebas-Titel,
   darunter weiße Seiten mit gesperrten Bebas-Überschriften, cremefarbenen Icon-Kreisen und Zitat-Flächen.
   Unten (Handy) bzw. oben (Rechner) fünf Reiter. Bewusst nur ein helles Erscheinungsbild, wie das gedruckte Workbook. */
:root {
  --tuerkis: #1AC7C9;
  --tuerkis-hell: #E8FAFA;
  --gelb: #F4D35E;
  --creme: #FFF7D6;
  --weiss: #FFFFFF;
  --schwarz: #111111;
  --grau: #757575;
  --linie: #DDEDED;
  --display: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
  --text: "Avenir Next", Avenir, "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --schreib: "Kristi", "Segoe Script", "Bradley Hand", cursive;
  --tabs: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--weiss); color: var(--schwarz); font-family: var(--text); font-weight: 300; font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--schwarz); outline-offset: 2px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.seite { max-width: 1120px; margin-inline: auto; padding-inline: 18px; }
main { padding-bottom: calc(var(--tabs) + 28px); }
.ansicht { display: flex; flex-direction: column; gap: 34px; padding-block: 26px 10px; }

/* Kopf */
.kopf { background: var(--weiss); border-bottom: 1px solid var(--linie); }
.kopf .seite { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 58px; }
.marke { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 21px; letter-spacing: .14em; background: none; border: 0; padding: 0; }
.marke img { width: 34px; height: 34px; }
.reiter { display: flex; }
.reiter button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--grau); position: relative; flex: 1; min-width: 0; }
.reiter button[aria-current="page"] { color: var(--schwarz); }
.reiter button[aria-current="page"]::after { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; background: var(--tuerkis); border-radius: 0 0 3px 3px; }
.reiter .zahl { position: absolute; top: 3px; left: calc(50% + 6px); background: var(--gelb); color: var(--schwarz); font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
nav.unten { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--weiss); border-top: 1px solid var(--linie); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.unten .reiter { max-width: 560px; margin-inline: auto; height: var(--tabs); }
nav.oben { display: none; }
@media (min-width: 860px) {
  nav.unten { display: none; }
  nav.oben { display: block; }
  nav.oben .reiter { gap: 6px; }
  nav.oben .reiter button { flex-direction: row; gap: 7px; font-size: 14px; padding: 18px 12px; flex: none; }
  nav.oben .reiter button[aria-current="page"]::after { top: auto; bottom: 0; left: 12px; right: 12px; border-radius: 3px 3px 0 0; }
  nav.oben .reiter .zahl { position: static; }
  nav.oben svg.i { width: 20px; height: 20px; }
  main { padding-bottom: 48px; }
}

/* Auftakt wie die Workbook-Titelseite */
.auftakt { background: linear-gradient(165deg, #1AC7C9 0%, #5FD8D8 55%, #BDEFEE 100%); }
.auftakt .seite { padding-block: 34px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.auftakt img { width: 92px; height: 92px; }
.auftakt .schreib { font-family: var(--schreib); font-size: clamp(38px, 9vw, 54px); line-height: 1; color: var(--weiss); margin-top: 6px; }
.auftakt h1 { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 11vw, 78px); line-height: .95; letter-spacing: .03em; text-wrap: balance; }
.auftakt p { font-family: var(--display); font-size: clamp(17px, 4.2vw, 22px); letter-spacing: .06em; line-height: 1.2; max-width: 30ch; margin-top: 8px; }

/* Überschriften */
.titel { display: flex; flex-direction: column; gap: 6px; }
.titel h2 { font-family: var(--display); font-weight: 400; font-size: 27px; letter-spacing: .14em; line-height: 1.1; }
.titel h2::after { content: ""; display: block; width: 56px; height: 2px; background: var(--tuerkis); margin-top: 8px; }
.titel p { color: var(--grau); font-weight: 400; font-size: 15px; max-width: 60ch; }
.block { display: flex; flex-direction: column; gap: 18px; }

/* Ernährungsformen */
.formen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 760px) { .formen { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
.form { background: var(--tuerkis-hell); border: 0; border-radius: 18px; padding: 16px 14px 14px; text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.form:hover { background: #D6F5F5; }
.form .kreis { width: 52px; height: 52px; border-radius: 50%; background: var(--creme); display: grid; place-items: center; }
.form .kreis svg.i { width: 28px; height: 28px; }
.form b { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 5.6vw, 24px); letter-spacing: .05em; line-height: 1.05; overflow-wrap: break-word; }
.form span { font-size: 14px; font-weight: 400; line-height: 1.35; }
.form i { font-style: normal; font-family: var(--display); font-size: 15px; letter-spacing: .08em; margin-top: auto; padding-top: 4px; }

/* Zitat-Fläche wie im Workbook */
.zitat { background: var(--creme); border-radius: 44px 58px 48px 62px; padding: 30px 26px; position: relative; text-align: center; }
.zitat::before, .zitat::after { font-family: Georgia, "Times New Roman", serif; font-size: 70px; line-height: 0; position: absolute; }
.zitat::before { content: "\201C"; top: 34px; left: 18px; }
.zitat::after { content: "\201D"; bottom: 4px; right: 20px; }
.zitat p { font-family: var(--display); font-size: clamp(20px, 4.6vw, 26px); letter-spacing: .05em; line-height: 1.2; max-width: 34ch; margin-inline: auto; text-wrap: balance; }
.zitat small { display: block; font-size: 14px; font-weight: 400; margin-top: 10px; }

/* Filter-Knöpfe */
.wahl { display: flex; flex-wrap: wrap; gap: 8px; }
.knopf { background: var(--weiss); border: 1px solid var(--schwarz); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 400; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.knopf small { font-size: 12px; color: var(--grau); font-variant-numeric: tabular-nums; }
.knopf:hover { background: var(--tuerkis-hell); }
.knopf[aria-pressed="true"] { background: var(--tuerkis); border-color: var(--tuerkis); font-weight: 600; }
.knopf[aria-pressed="true"] small { color: var(--schwarz); }
.filter { display: flex; flex-direction: column; gap: 12px; }
.filter .reihe { display: grid; grid-template-columns: 1fr; gap: 6px; }
.filter .reihe > span { font-family: var(--display); font-size: 15px; letter-spacing: .12em; }
@media (min-width: 760px) { .filter .reihe { grid-template-columns: 150px 1fr; align-items: start; } .filter .reihe > span { padding-top: 7px; } }
.suche { display: flex; align-items: center; gap: 10px; border: 1px solid var(--schwarz); border-radius: 999px; padding: 9px 16px; }
.suche input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; font-weight: 400; }
.suche:focus-within { outline: 2px solid var(--tuerkis); outline-offset: 1px; }
.stand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.stand b { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .08em; }
.link { background: none; border: 0; padding: 0; font-size: 14px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--tuerkis); text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* Vorstellung einer Ernährungsform */
.vorstellung { background: linear-gradient(165deg, #1AC7C9 0%, #7FE0DE 100%); border-radius: 22px; padding: 22px 20px; display: grid; gap: 14px; }
.vorstellung .schreib { font-family: var(--schreib); font-size: 38px; line-height: .9; color: var(--weiss); }
.vorstellung h2 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 7vw, 44px); letter-spacing: .05em; line-height: 1; }
.vorstellung dl { margin: 0; display: grid; gap: 10px; }
.vorstellung dt { font-family: var(--display); font-size: 15px; letter-spacing: .12em; }
.vorstellung dd { margin: 0; font-weight: 400; max-width: 62ch; }
@media (min-width: 760px) { .vorstellung { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); align-items: center; padding: 28px; } }
.planhinweis { background: var(--gelb); border-radius: 14px; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; font-weight: 400; }

/* Rezeptkarten */
.karten { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
@media (min-width: 620px) { .karten { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 16px; } }
@media (min-width: 960px) { .karten { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.karte { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.karte .oeffnen { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.foto { aspect-ratio: 4 / 3; width: 100%; border-radius: 16px; overflow: hidden; background: var(--tuerkis-hell); display: grid; place-items: center; position: relative; }
.karte:nth-child(3n+2) .foto { background: var(--creme); }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
.foto svg.i { width: 44px; height: 44px; stroke-width: 1.1; color: var(--tuerkis); }
.karte:nth-child(3n+2) .foto svg.i { color: #D9B42E; }
.karte h3 { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .05em; line-height: 1.08; overflow-wrap: anywhere; }
.karte .oeffnen:hover h3 { text-decoration: underline; text-decoration-color: var(--tuerkis); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.karte .meta { font-size: 13px; font-weight: 400; color: var(--grau); }
.karte .warum { font-size: 13px; font-weight: 400; line-height: 1.4; }
.marken { display: flex; flex-wrap: wrap; gap: 5px; }
.markeF, .markeA { font-size: 12px; font-weight: 400; padding: 1px 8px; border-radius: 999px; }
.markeF { background: var(--tuerkis-hell); }
.markeA { background: var(--creme); }
.herz { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--weiss); display: grid; place-items: center; z-index: 1; }
.herz svg.i { width: 20px; height: 20px; }
.herz[aria-pressed="true"] svg.i { fill: var(--tuerkis); stroke: var(--tuerkis); }
.mehr { align-self: center; }
.gross { background: var(--schwarz); color: var(--weiss); border: 0; border-radius: 999px; padding: 11px 22px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.gross.hell { background: var(--gelb); color: var(--schwarz); }
.gross.rand { background: var(--weiss); color: var(--schwarz); border: 1px solid var(--schwarz); }
.gross svg.i { width: 20px; height: 20px; }
.gross[aria-pressed="true"] svg.i { fill: var(--tuerkis); stroke: var(--tuerkis); }
.leer { background: var(--tuerkis-hell); border-radius: 22px; padding: 30px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.leer .schreib { font-family: var(--schreib); font-size: 40px; line-height: .9; }
.leer p { max-width: 44ch; font-weight: 400; }

/* Rezept-Seite */
.blatt { position: fixed; inset: 0; z-index: 40; background: rgba(17, 17, 17, .45); overflow-y: auto; overscroll-behavior: contain; }
.blatt .innen { background: var(--weiss); min-height: 100%; max-width: 780px; margin-inline: auto; display: flex; flex-direction: column; padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 820px) { .blatt { padding-block: 28px; } .blatt .innen { min-height: 0; border-radius: 22px; overflow: hidden; } }
.blatt .foto { border-radius: 0; aspect-ratio: 16 / 9; }
.blatt .zu { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--weiss); display: grid; place-items: center; z-index: 2; }
.blatt .zu svg.i { width: 22px; height: 22px; stroke-width: 1.8; color: var(--schwarz); }
.blatt .foto.ohne { aspect-ratio: auto; height: 120px; }
.blatt .quelle { font-size: 11px; font-weight: 400; color: var(--grau); padding: 6px 20px 0; overflow-wrap: anywhere; }
.blatt .inhalt { padding: 14px 20px 0; display: flex; flex-direction: column; gap: 26px; }
.blatt .schreib { font-family: var(--schreib); font-size: 36px; line-height: .8; color: var(--tuerkis); }
.blatt h2 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 7.5vw, 44px); letter-spacing: .04em; line-height: 1; text-wrap: balance; }
.blatt h3 { font-family: var(--display); font-weight: 400; font-size: 21px; letter-spacing: .14em; }
.blatt h3::after { content: ""; display: block; width: 44px; height: 2px; background: var(--tuerkis); margin-top: 6px; }
.blatt .kurz { font-weight: 400; max-width: 62ch; }
.zeiten { display: flex; flex-wrap: wrap; gap: 8px 22px; font-weight: 400; font-size: 15px; }
.zeiten span { display: inline-flex; align-items: center; gap: 6px; }
.zeiten svg.i { width: 19px; height: 19px; color: var(--tuerkis); }
.taten { display: flex; flex-wrap: wrap; gap: 10px; }
.tage { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--creme); border-radius: 16px; padding: 12px 14px; }
.tage span { font-weight: 400; font-size: 14px; flex-basis: 100%; }
.tage button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--schwarz); background: var(--weiss); font-family: var(--display); font-size: 18px; letter-spacing: .04em; }
.tage button:hover { background: var(--tuerkis); border-color: var(--tuerkis); }
.passt { display: grid; gap: 10px; }
.passt div { background: var(--tuerkis-hell); border-radius: 14px; padding: 12px 14px; }
.passt b { font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: .08em; display: block; }
.passt p { font-weight: 400; font-size: 15px; }
.portionen { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.zaehler { display: inline-flex; align-items: center; gap: 4px; }
.zaehler button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--schwarz); background: var(--weiss); display: grid; place-items: center; }
.zaehler button:disabled { opacity: .3; cursor: default; }
.zaehler output { font-family: var(--display); font-size: 22px; min-width: 3.4em; white-space: nowrap; padding-inline: 4px; text-align: center; letter-spacing: .04em; }
.zutaten { list-style: none; margin: 0; padding: 0; }
.zutaten li { display: grid; grid-template-columns: 6.2em 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--linie); font-weight: 400; }
.zutaten li b { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.zutaten li small { color: var(--grau); font-size: 13px; }
.schritte { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 14px; }
.schritte li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; font-weight: 400; }
.schritte li::before { content: counter(s); width: 34px; height: 34px; border-radius: 50%; background: var(--creme); display: grid; place-items: center; font-family: var(--display); font-size: 18px; }
.klein { font-size: 14px; font-weight: 400; color: var(--grau); }
details.werte { border: 1px solid var(--linie); border-radius: 14px; padding: 12px 14px; }
details.werte summary { cursor: pointer; font-weight: 600; }
details.werte table { border-collapse: collapse; width: 100%; margin-top: 10px; font-weight: 400; font-variant-numeric: tabular-nums; }
details.werte td { padding: 5px 0; border-bottom: 1px solid var(--linie); }
details.werte td:last-child { text-align: right; }

/* Wochenplan und Einkaufsliste */
.woche { display: grid; gap: 12px; }
@media (min-width: 760px) { .woche { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tag { border: 1px solid var(--linie); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tag header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tag h3 { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .12em; }
.tag ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tag li { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; background: var(--tuerkis-hell); border-radius: 12px; padding: 8px 10px 8px 12px; }
.tag li .name { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.tag li .zeile { display: flex; align-items: center; gap: 2px; }
.mini { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--weiss); display: grid; place-items: center; }
.mini svg.i { width: 16px; height: 16px; }
.tag li output { font-size: 13px; font-weight: 600; min-width: 2.6em; text-align: center; }
.tag .frei { font-size: 14px; color: var(--grau); font-weight: 400; }
.rund { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--schwarz); background: var(--weiss); display: grid; place-items: center; }
.rund:hover { background: var(--gelb); border-color: var(--gelb); }
.rund svg.i { width: 18px; height: 18px; }
.liste { display: grid; gap: 22px; }
@media (min-width: 760px) { .liste { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 32px; } }
.gruppe h3 { font-family: var(--display); font-weight: 400; font-size: 19px; letter-spacing: .14em; border-bottom: 2px solid var(--tuerkis); padding-bottom: 4px; margin-bottom: 4px; }
.gruppe label { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--linie); font-weight: 400; cursor: pointer; }
.gruppe input { width: 20px; height: 20px; accent-color: var(--tuerkis); margin: 0; }
.gruppe input:checked + span { text-decoration: line-through; color: var(--grau); }
/* Umschalter Übersicht / Swipen */
.umschalter { display: flex; border: 1px solid var(--schwarz); border-radius: 999px; padding: 3px; max-width: 420px; width: 100%; margin-inline: auto; }
.umschalter button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 8px 12px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.umschalter button[aria-pressed="true"] { background: var(--schwarz); color: var(--weiss); }
.umschalter svg.i { width: 19px; height: 19px; }
.filterzeile { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.swipen { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.swipen .hinweis { font-family: var(--display); letter-spacing: .1em; font-size: 15px; }
.stapel { position: relative; width: min(100%, 400px); height: 540px; max-height: calc(100vh - 392px); max-height: calc(100dvh - 392px); min-height: 330px; }
.ansicht.swipeansicht { gap: 14px; padding-top: 18px; }
body { overflow-x: clip; }
.swipe { position: absolute; inset: 0; background: var(--weiss); border-radius: 26px; box-shadow: 0 10px 30px rgba(17, 17, 17, .16); overflow: hidden; display: flex; flex-direction: column; }
.swipe.hinten { transform: scale(.95) translateY(14px); box-shadow: 0 6px 18px rgba(17, 17, 17, .10); }
.swipe.vorn { touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.swipe.vorn.zieht { cursor: grabbing; }
.swipe.fliegt { transition: transform .28s ease-in, opacity .28s ease-in; }
.swipe.zurueck { transition: transform .2s ease-out; }
.swipe .foto { border-radius: 0; flex: 1; aspect-ratio: auto; min-height: 0; }
.swipe .foto img { pointer-events: none; }
.swipe .text { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 6px; }
.swipe h3 { font-family: var(--display); font-weight: 400; font-size: 27px; letter-spacing: .04em; line-height: 1.02; overflow-wrap: anywhere; }
.swipe .meta { font-size: 13px; font-weight: 400; color: var(--grau); }
.swipe .kurztext { font-size: 14px; font-weight: 400; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stempel { position: absolute; top: 18px; font-family: var(--display); font-size: 26px; letter-spacing: .1em; padding: 2px 14px; border-radius: 10px; border: 3px solid var(--schwarz); background: var(--weiss); opacity: 0; z-index: 2; pointer-events: none; }
.stempel.ja { left: 16px; transform: rotate(-10deg); background: var(--tuerkis); }
.stempel.nein { right: 16px; transform: rotate(10deg); background: var(--gelb); }
.swipeknoepfe { display: flex; align-items: center; justify-content: center; gap: 14px; }

  function swipeFertig(richtung) {
    var k = document.getElementById('swipekarte'); if (!k) return;
    var r = NACH[k.dataset.s], warFav = Z.fav.indexOf(r.s) > -1;
    if (Z.gesehen.indexOf(r.s) < 0) Z.gesehen.push(r.s);
    if (richtung === 'ja' && !warFav) Z.fav.unshift(r.s);
    Z.letzter = { s: r.s, richtung: richtung, warFav: warFav };
    merken();
    var ruhig = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var weiter = function () { zeichne(); if (richtung === 'ja') melde('Auf der Merkliste'); };
    if (ruhig) { weiter(); return; }
    k.classList.remove('zieht', 'zurueck'); k.classList.add('fliegt');
    k.style.transform = 'translate(' + (richtung === 'ja' ? 1 : -1) * (window.innerWidth * 0.9 + 200) + 'px, 40px) rotate(' + (richtung === 'ja' ? 22 : -22) + 'deg)';
    k.style.opacity = '0';
    setTimeout(weiter, 260);
  }
  function swipeBinden() {
    var k = document.getElementById('swipekarte'); if (!k) return;
    var ja = k.querySelector('.stempel.ja'), nein = k.querySelector('.stempel.nein'), x0 = 0, y0 = 0, dx = 0, aktivZug = false, bewegt = false;
    k.addEventListener('pointerdown', function (e) {
      if (e.button) return;
      aktivZug = true; bewegt = false; x0 = e.clientX; y0 = e.clientY; dx = 0;
      k.classList.remove('zurueck');
      try { k.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
    });
    k.addEventListener('pointermove', function (e) {
      if (!aktivZug) return;
      dx = e.clientX - x0; var dy = e.clientY - y0;
      if (!bewegt && Math.abs(dx) < 8) return;
      bewegt = true; k.classList.add('zieht');
      k.style.transform = 'translate(' + dx + 'px, ' + dy * 0.15 + 'px) rotate(' + dx / 20 + 'deg)';
      ja.style.opacity = Math.max(0, Math.min(1, dx / 90)); nein.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    });
    var ende = function (abbruch) {
      if (!aktivZug) return; aktivZug = false; k.classList.remove('zieht');
      if (!bewegt) { if (!abbruch) oeffne(NACH[k.dataset.s]); return; }
      if (!abbruch && Math.abs(dx) > 90) { swipeFertig(dx > 0 ? 'ja' : 'nein'); return; }
      k.classList.add('zurueck'); k.style.transform = ''; ja.style.opacity = 0; nein.style.opacity = 0;
    };
    k.addEventListener('pointerup', function () { ende(false); });
    k.addEventListener('pointercancel', function () { ende(true); });
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a'); if (!t) { if (e.target.id === 'blatt') schliesse(); return; }
    var d = t.dataset;
    if (d.geh) { geh(d.geh); }
    else if (d.start) { Z.modus = d.start; Z.formen = []; Z.alltag = []; Z.mahl = ''; Z.q = ''; Z.filterAuf = false; geh('rezepte'); }
    else if (d.modus) { Z.modus = d.modus; Z.filterAuf = false; Z.grenze = 24; zeichne(); }
    else if (t.hasAttribute('data-filter-auf')) { Z.filterAuf = !Z.filterAuf; zeichne(); }
    else if (d.swipe) { swipeFertig(d.swipe); }
    else if (t.hasAttribute('data-swipe-undo')) {
      var l = Z.letzter; if (l) { Z.gesehen = Z.gesehen.filter(function (x) { return x !== l.s; }); if (l.richtung === 'ja' && !l.warFav) Z.fav = Z.fav.filter(function (x) { return x !== l.s; }); Z.letzter = null; merken(); zeichne(); }
    }
    else if (t.hasAttribute('data-swipe-neu')) { Z.gesehen = []; Z.letzter = null; merken(); zeichne(); }
    else if (d.form) { Z.formen = [d.form]; Z.alltag = []; Z.mahl = ''; Z.q = ''; geh('rezepte'); }
    else if (d.filter) {
      if (d.filter === 'f') schalte(Z.formen, d.wert); else if (d.filter === 'a') schalte(Z.alltag, d.wert); else Z.mahl = Z.mahl === d.wert ? '' : d.wert;
      if (Z.ansicht !== 'rezepte') { if (d.filter === 'a') Z.alltag = [d.wert]; if (d.filter === 'm') Z.mahl = d.wert; Z.formen = []; Z.q = ''; geh('rezepte'); } else { Z.grenze = 24; zeichne(); }
    }
    else if (t.hasAttribute('data-filter-leeren')) { Z.formen = []; Z.alltag = []; Z.mahl = ''; Z.q = ''; Z.grenze = 24; zeichne(); }
    else if (t.hasAttribute('data-mehr')) { Z.grenze += 24; zeichne(); }
    else if (d.herz) { herz(d.herz); }
    else if (d.rezept) {
      var r = NACH[d.rezept];
      if (Z.waehlTag && Z.ansicht === 'rezepte') { var tag = Z.waehlTag; einplanen(tag, r, r.n); Z.waehlTag = ''; geh('plan', false); }
      else oeffne(r);
    }
    else if (t.hasAttribute('data-zu')) { schliesse(); }
    else if (d.portion) { var ro = Z.offen, sch = ro.eh ? ro.n : 1; Z.portionen = Math.max(sch, Math.min(ro.eh ? ro.n * 3 : 12, Z.portionen + Number(d.portion) * sch)); blatt(); var z = document.querySelector('#blatt [data-portion="' + d.portion + '"]'); if (z && !z.disabled) z.focus(); }
    else if (t.hasAttribute('data-tagwahl')) { Z.tagwahl = !Z.tagwahl; blatt(); }
    else if (d.einplanen) { einplanen(d.einplanen, Z.offen, Z.portionen); Z.tagwahl = false; blatt(); zeichne(); }
    else if (d.tagPlus) { Z.waehlTag = d.tagPlus; Z.formen = []; Z.alltag = []; Z.mahl = ''; Z.q = ''; Z.ansicht = 'rezepte'; Z.grenze = 24; zeichne(); window.scrollTo(0, 0); }
    else if (t.hasAttribute('data-waehl-ende')) { Z.waehlTag = ''; geh('plan'); }
    else if (d.planN) { var p = d.planN.split(':'), x = Z.plan[p[0]][Number(p[1])]; var sr = NACH[x.s], st = sr.eh ? sr.n : 1; x.n = Math.max(st, Math.min(sr.eh ? sr.n * 3 : 12, x.n + Number(p[2]) * st)); merken(); zeichne(); }
    else if (d.planWeg) { var q = d.planWeg.split(':'); Z.plan[q[0]].splice(Number(q[1]), 1); merken(); zeichne(); }
    else if (t.hasAttribute('data-woche-leeren')) {
      if (t.dataset.sicher) { TAGE.forEach(function (g) { Z.plan[g[0]] = []; }); Z.haken = []; merken(); zeichne(); melde('Woche geleert'); }
      else { t.dataset.sicher = '1'; t.textContent = 'Wirklich leeren? Nochmal tippen'; }
    }
    else if (t.hasAttribute('data-haken-weg')) { Z.haken = []; merken(); zeichne(); }
    else if (t.hasAttribute('data-kopieren')) {
      var text = einkaufText();
      try { navigator.clipboard.writeText(text).then(function () { melde('Einkaufsliste kopiert'); }, function () { melde('Kopieren ist hier nicht möglich'); }); } catch (err) { melde('Kopieren ist hier nicht möglich'); }
    }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.dataset && e.target.dataset.haken; if (!k) return;
    var id = e.target.id; schalte(Z.haken, k); merken(); zeichne();
    var wieder = document.getElementById(id); if (wieder) wieder.focus();
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'suchfeld') return;
    Z.q = e.target.value; Z.grenze = 24; zeichne(true);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && Z.offen) { schliesse(); return; }
    if (Z.offen || Z.ansicht !== 'rezepte' || Z.modus !== 'swipe' || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') swipeFertig('ja'); else if (e.key === 'ArrowLeft') swipeFertig('nein');
  });

  var start = (location.hash || '').slice(1);
  if (ANSICHT[start]) Z.ansicht = start;
  zeichne();
})();
